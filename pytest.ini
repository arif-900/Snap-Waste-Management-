[pytest]
minversion = 6.0
addopts = -ra -q --tb=short --cov=backend/app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
testpaths =
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
